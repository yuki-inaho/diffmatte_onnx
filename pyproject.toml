[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffmatte-onnx-runtime"
version = "0.1.0"
description = "Minimal ONNX Runtime inference CLI for DiffMatte"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy>=1.26,<2",
  "onnxruntime>=1.20,<2",
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
diffmatte-infer-onnx = "diffmatte_onnx.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

